[project]
name = "osint_app"
version = "0.1.0"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.5.0",
    "networkx>=3.2.0",
    "dnspython>=2.4.0",
    "rich>=13.0.0",
]

[project.scripts]
argus-backend = "backend:main"
argus-cli = "interfaces.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
