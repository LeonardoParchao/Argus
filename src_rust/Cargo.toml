[package]
name = "osint_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
trust-dns-resolver = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[lib]
name = "osint_rust"
crate-type = ["cdylib"]

[[bin]]
name = "osint_binary"
path = "src/main.rs"
